name: Keep backend warm

# Pings the Render backend every 5 minutes so the free-tier service never
# spins down (it sleeps after ~15 min idle, then cold-starts 30-60s — which
# makes the first page load show empty reports). This replaces the unreliable
# Vercel cron (Hobby plan caps crons at once/day).
#
# Manual run: Actions tab -> "Keep backend warm" -> Run workflow.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend /api/health (wakes it if cold)
        run: |
          URL="https://two026-space-qlik-back.onrender.com/api/health"
          for attempt in 1 2 3 4; do
            code=$(curl -s -o /tmp/body -m 90 -w "%{http_code}" "$URL" || echo "000")
            echo "attempt $attempt -> HTTP $code: $(head -c 120 /tmp/body)"
            if [ "$code" = "200" ]; then
              echo "Backend is warm."
              exit 0
            fi
            sleep 15
          done
          echo "::error::Backend did not return 200 after 4 attempts"
          exit 1
